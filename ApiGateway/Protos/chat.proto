syntax = "proto3";

option csharp_namespace = "NextGenVideoAI.ChatService.Api";

package chat;

service ChatService {
  // Отправка сообщения
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  
  // Создание нового чата
  rpc CreateChat (CreateChatRequest) returns (CreateChatResponse);
  
  // Получение сообщений чата
  rpc GetChatMessages (GetChatMessagesRequest) returns (GetChatMessagesResponse);
  
  // Получение списка чатов пользователя
  rpc GetUserChats (GetUserChatsRequest) returns (GetUserChatsResponse);

  // Получение всех чатов
  rpc GetChats (GetChatsRequest) returns (GetChatsResponse);

  // Стриминг ответа от ИИ
  rpc StreamChat (StreamChatRequest) returns (stream StreamChatResponse);

  // Получение сообщения по содержимому
  rpc GetMessage (GetMessageRequest) returns (GetMessageResponse);
  
  // Получение чата по ID
  rpc GetChatById (GetChatByIdRequest) returns (ChatInfo);
  
  // Прикрепление файла к сообщению
  rpc AttachFileToMessage (AttachFileRequest) returns (AttachFileResponse);
  
  // Удаление прикрепленного файла из сообщения
  rpc RemoveAttachedFile (RemoveAttachedFileRequest) returns (RemoveAttachedFileResponse);

  // Обновление чата (контекста и/или названия)
  rpc UpdateChat (UpdateChatRequest) returns (UpdateChatResponse);
}

message SendMessageRequest {
  string chat_id = 1;
  string content = 2;
  string sender_id = 3;
  SenderType sender_type = 4;
  bool requires_editing = 5;
  bool is_editing_stage = 6;
  repeated AttachmentInfo attachments = 7;
}

message SendMessageResponse {
  string message_id = 1;
  string content = 2;
  string created_at = 3;
  bool requires_editing = 4;
  bool is_editing_stage = 5;
  repeated AttachmentInfo attachments = 6;
  bool canceled = 7;
}

message CreateChatRequest {
  string name = 1;
  string user_id = 2;
  string chat_context = 3;
}

message CreateChatResponse {
  string chat_id = 1;
  string name = 2;
  string last_update = 3;
  bool is_busy = 4;
}

message GetChatMessagesRequest {
  string chat_id = 1;
  int32 skip = 2;
  int32 limit = 3;
}

message ChatMessage {
  string id = 1;
  string content = 2;
  string created_at = 3;
  SenderType sender_type = 4;
  string sender_id = 5;
  bool requires_editing = 6;
  bool is_editing_stage = 7;
  repeated AttachmentInfo attachments = 8;
  string command_id = 9;
  bool is_completed = 10;
  bool canceled = 11;
}

message GetChatMessagesResponse {
  repeated ChatMessage messages = 1;
  int32 total_count = 2;
}

message GetUserChatsRequest {
  string user_id = 1;
  int32 skip = 2;
  int32 limit = 3;
}

message ChatInfo {
  string id = 1;
  string name = 2;
  string chat_context = 3;
  string last_context_update_time = 4;
  string last_update = 5;
  bool is_busy = 6;
}

message GetUserChatsResponse {
  repeated ChatInfo chats = 1;
  int32 total_count = 2;
}

message GetChatByIdRequest {
  string chat_id = 1;
}

enum SenderType {
  USER = 0;
  AI = 1;
  AI2 = 2;
}

message GetChatsRequest {
  int32 skip = 1;
  int32 limit = 2;
}

message GetChatsResponse {
  repeated ChatInfo chats = 1;
  int32 total_count = 2;
}

message StreamChatRequest {
  string chat_id = 1;
  string content = 2;
  string user_id = 3;
  repeated AttachmentInfo attachments = 4;
  int32 last_received_length = 5;
}

message StreamChatResponse {
  string content = 1;
  bool is_final = 2;
  string error = 3;
}

message GetMessageRequest {
  string chat_id = 1;
  string content = 2;
}

message GetMessageResponse {
  string message_id = 1;
  string content = 2;
  string created_at = 3;
  SenderType sender_type = 4;
  string sender_id = 5;
  bool requires_editing = 6;
  bool is_editing_stage = 7;
  repeated AttachmentInfo attachments = 8;
  string command_id = 9;
  bool is_completed = 10;
  bool canceled = 11;
}

// Информация о прикрепленном файле
message AttachmentInfo {
  string file_id = 1;
  string file_name = 2;
  string content_type = 3;
}

// Запрос на прикрепление файла к сообщению
message AttachFileRequest {
  string message_id = 1;
  AttachmentInfo attachment = 2;
}

// Ответ на прикрепление файла
message AttachFileResponse {
  string attachment_id = 1;
  string message_id = 2;
  AttachmentInfo attachment = 3;
}

// Запрос на удаление прикрепленного файла
message RemoveAttachedFileRequest {
  string attachment_id = 1;
  string message_id = 2;
}

// Ответ на удаление прикрепленного файла
message RemoveAttachedFileResponse {
  bool success = 1;
}

message UpdateChatRequest {
  string chat_id = 1;
  string name = 2; // новое имя (опционально)
  string chat_context = 3; // новый контекст (опционально)
  bool is_busy = 4; // установить флаг занятости (опционально)
}

message UpdateChatResponse {
  ChatInfo chat = 1;
}