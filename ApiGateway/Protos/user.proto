syntax = "proto3";

option csharp_namespace = "UserService.Protos";

// Добавляем новый тип для информации о токене
message TokenInfo {
  string token = 1;
  string refresh_token = 2;
  string device_info = 3;
  string ip_address = 4;
  string created_at = 5;
  string expires_at = 6;
  string username = 8;
  string user_id = 9;
  string email = 10;
}

// Добавляем новый тип для профиля пользователя
message UserProfile {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
}

service UserService {
  // Существующие методы
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  
  // Новые методы для работы с токенами
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RevokeToken (RevokeTokenRequest) returns (RevokeTokenResponse);
  rpc RevokeAllUserTokens (RevokeAllUserTokensRequest) returns (RevokeAllUserTokensResponse);
  
  // Метод для получения профиля пользователя
  rpc GetUserProfile (GetUserProfileRequest) returns (GetUserProfileResponse);

  // Методы для работы с email-кодом
  rpc RequestEmailCode (RequestEmailCodeRequest) returns (RequestEmailCodeResponse);
  rpc ConfirmEmailCode (ConfirmEmailCodeRequest) returns (ConfirmEmailCodeResponse);
}

// Обновляем существующие сообщения
message LoginRequest {
  string username = 1;
  string password = 2;
  string device_info = 3;
  string ip_address = 4;
}

message LoginResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  TokenInfo token_info = 4;
}

// Новые сообщения для работы с токенами
message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  string user_id = 2;
  TokenInfo token_info = 3;
}

message RevokeTokenRequest {
  string token = 1;
  string user_id = 2;
}

message RevokeTokenResponse {
  bool success = 1;
  string message = 2;
}

message RevokeAllUserTokensRequest {
  string user_id = 1;
}

message RevokeAllUserTokensResponse {
  bool success = 1;
  int32 revoked_count = 2;
}

// Сообщения для получения профиля пользователя
message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

// Обновляем существующие сообщения
message RegisterUserRequest {
  string username = 1;
  string password = 2;
  string device_info = 3;
  string ip_address = 4;
}

message RegisterUserResponse {
  string user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  TokenInfo token_info = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  TokenInfo token_info = 3;
}

// Email-код: запрос и подтверждение
message RequestEmailCodeRequest {
  string user_id = 1;
  string email = 2;
}

message RequestEmailCodeResponse {
  bool success = 1;
}

message ConfirmEmailCodeRequest {
  string user_id = 1;
  string email = 2;
  string code = 3;
}

message ConfirmEmailCodeResponse {
  bool success = 1;
}