name: Build and Push Gateway Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Docker Hub credentials from Deploy repo
        uses: actions/github-script@v7
        with:
          script: |
            const { data: secrets } = await github.rest.actions.listRepositorySecrets({
              owner: 'furye',
              repo: 'NextGenVideoAI-Deploy'
            });

            const dockerhubUsername = secrets.secrets.find(s => s.name === 'NEXTGEN_VIDEO_AI_DOCKERHUB_USERNAME');
            const dockerhubToken = secrets.secrets.find(s => s.name === 'NEXTGEN_VIDEO_AI_DOCKERHUB_TOKEN');

            if (!dockerhubUsername || !dockerhubToken) {
              throw new Error('Docker Hub credentials not found in Deploy repository');
            }

            core.setOutput('username', dockerhubUsername.value);
            core.setOutput('token', dockerhubToken.value);

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.get-credentials.outputs.username }}
          password: ${{ steps.get-credentials.outputs.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ApiGateway/Dockerfile
          push: true
          tags: ${{ steps.get-credentials.outputs.username }}/nextgen-video-ai-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
